<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RHEMA PILOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132A22; --primary:#1F6B4C; --primary-light:#E7F0EA;
  --accent:#B8623C; --accent-light:#F3E4DC;
  --bg:#F6F7F6; --card:#FFFFFF; --line:#E3E6E2;
  --muted:#6B7570; --muted-light:#9AA39D;
  --danger:#B84438; --danger-light:#F5E3E0;
  --warn:#96701F; --warn-light:#F1E8D6;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.icon{width:18px; height:18px; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
.icon-sm{width:14px; height:14px;}
.icon-lg{width:22px; height:22px;}

#app-shell{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column;}
.screen-root{flex:1; padding:20px 18px 106px;}
.voice{font-family:'Fraunces',serif;}
.page-title{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:2px 0 4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.page-sub{font-size:12.5px; color:var(--muted); margin:0 0 18px;}

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.who{display:flex; align-items:center; gap:10px; background:none; border:none; text-align:left; padding:0;}
.icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0;}
.icon-btn.dot{position:relative;}
.icon-btn.dot::after{content:''; position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--accent); border:1.5px solid var(--card);}
.avatar{width:36px; height:36px; border-radius:9px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0; background:var(--ink);}
.greet{display:flex; flex-direction:column; line-height:1.2;}
.greet .hello{font-size:11px; color:var(--muted); font-weight:500;}
.greet .name{font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--ink);}

.month-switch{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 8px; margin-bottom:16px;}
.month-switch button{border:none; background:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--muted); border-radius:8px;}
.month-switch button:hover{background:var(--bg);}
.month-switch .m-label{font-family:'Fraunces',serif; font-size:15px; font-weight:600; text-align:center; flex:1;}
.status-pill{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:7px; border:none; letter-spacing:.02em;}
.status-pill.ok{background:var(--primary-light); color:var(--primary);}
.status-pill.warn{background:var(--accent-light); color:var(--accent);}
.status-pill.neutral{background:var(--bg); color:var(--muted); border:1px solid var(--line);}
.status-pill.danger{background:var(--danger-light); color:var(--danger);}

.obj-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px;}
.obj-card-top{display:flex; align-items:center; gap:16px;}
.ring-wrap{width:74px; height:74px; flex-shrink:0;}
.ring-pct{font-family:'Fraunces',serif; font-size:14px; font-weight:600; fill:var(--ink);}
.obj-label{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
.obj-number{font-family:'Fraunces',serif; font-size:24px; font-weight:700; color:var(--ink);}
.obj-number small{font-family:'Plus Jakarta Sans'; font-size:13px; font-weight:500; color:var(--muted-light);}
.obj-gap{font-size:12px; color:var(--muted); margin-top:2px;}
.obj-gap b{color:var(--accent); font-weight:700;}

.metric-list{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 16px;}
.metric-row{padding:12px 0; border-bottom:1px solid var(--line);}
.metric-row:last-child{border-bottom:none;}
.metric-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.metric-label{font-size:13px; font-weight:600; color:var(--ink);}
.metric-value{font-family:'Fraunces',serif; font-size:15px; font-weight:700;}
.metric-value span{font-family:'Plus Jakarta Sans'; font-size:11.5px; color:var(--muted-light); font-weight:500;}
.bar-track{height:5px; background:var(--line); border-radius:5px; overflow:hidden;}
.bar-fill{height:100%; border-radius:5px; background:var(--primary);}
.bar-fill.warn{background:var(--accent);}

.section-title{font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:22px 0 10px; display:flex; justify-content:space-between; align-items:center;}
.section-title button.link{background:none; border:none; font-size:11.5px; color:var(--primary); font-weight:700; text-transform:none; letter-spacing:0; padding:0; display:flex; align-items:center; gap:3px;}

.alert-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.alert-chip{border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px; text-align:left; display:flex; flex-direction:column; gap:2px;}
.alert-chip .n{font-family:'Fraunces',serif; font-size:19px; font-weight:700;}
.alert-chip .l{font-size:11px; color:var(--muted); font-weight:600;}
.alert-chip.has-value .n{color:var(--danger);}

.list-card{background:var(--card); border:1px solid var(--line); border-radius:14px;}
.list-row{display:flex; gap:12px; align-items:flex-start; padding:13px 16px; border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.list-row .row-icon{width:30px; height:30px; border-radius:9px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0;}
.row-text{font-size:12.5px; color:var(--ink); line-height:1.4;}
.row-time{font-size:11px; color:var(--muted-light); margin-top:2px;}

.search{display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:12px; color:var(--muted);}
.search input{border:none; outline:none; background:transparent; font-size:13px; width:100%; color:var(--ink);}
.search input::placeholder{color:var(--muted-light);}
.filters{display:flex; gap:7px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.filters::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; font-size:12px; font-weight:600; padding:7px 14px; border-radius:8px; background:var(--card); color:var(--muted); border:1px solid var(--line); white-space:nowrap;}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.view-toggle{display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:12px; gap:3px;}
.view-toggle button{flex:1; border:none; background:transparent; padding:8px; border-radius:7px; font-size:12px; font-weight:600; color:var(--muted);}
.view-toggle button.active{background:var(--ink); color:#fff;}

.prospect-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:9px; width:100%; text-align:left;}
.prospect-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.prospect-name{font-family:'Fraunces',serif; font-size:15.5px; font-weight:600; color:var(--ink);}
.prospect-book{font-size:12px; color:var(--muted); margin:1px 0 8px;}
.badge-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:7px;}
.temp-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--muted);}
.temp-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
.temp-dot.chaud{background:var(--accent);}
.temp-dot.tiede{background:var(--warn);}
.temp-dot.froid{background:#7A93A8;}
.next-line{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; margin-bottom:8px;}
.next-line.overdue{color:var(--danger); font-weight:700;}
.next-line.none{color:var(--muted-light);}
.prospect-foot{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted-light); font-weight:600; border-top:1px solid var(--line); padding-top:9px;}
.who-avatar{width:18px; height:18px; border-radius:6px; font-size:8.5px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; margin-right:5px; background:var(--ink);}
.who-inline{display:flex; align-items:center;}

.pipeline-group{margin-bottom:16px;}
.pipeline-head{position:sticky; top:0; background:var(--bg); padding:6px 0; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--ink); z-index:2;}
.pipeline-count{background:var(--card); border:1px solid var(--line); border-radius:7px; font-size:10.5px; padding:1px 8px; color:var(--muted);}

.empty{text-align:center; padding:56px 20px; color:var(--muted);}
.empty .icon-lg{margin:0 auto 12px; color:var(--muted-light); width:32px; height:32px;}
.empty .voice{font-size:16px; color:var(--ink); margin-bottom:5px;}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
.profile-card{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.profile-card .avatar{width:48px; height:48px; font-size:16px;}
.profile-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.field-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px;}
.field-row:last-child{border-bottom:none;}
.field-row .icon{color:var(--muted-light);}
.field-label{color:var(--muted-light); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; font-weight:700;}
.field-value{color:var(--ink); font-weight:600;}
.desc{font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:10px;}
.meta-row{display:flex; gap:20px; font-size:12px; flex-wrap:wrap;}
.meta-row .field-label{display:block; margin-bottom:2px;}
.status-select, .text-input, .num-input, .date-input{width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:13px; font-weight:600; color:var(--ink); background:var(--card);}
.status-select{margin-top:4px;}
.temp-picker{display:flex; gap:7px; margin-top:5px;}
.temp-picker button{flex:1; border:1px solid var(--line); background:var(--card); border-radius:9px; padding:9px; font-size:12px; font-weight:600; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:5px;}
.temp-picker button.active{background:var(--ink); border-color:var(--ink); color:#fff;}

.timeline{position:relative; padding-left:16px;}
.timeline::before{content:''; position:absolute; left:4px; top:5px; bottom:5px; width:1px; background:var(--line);}
.tl-item{position:relative; padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute; left:-16px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--primary); border:2px solid var(--card); box-shadow:0 0 0 1px var(--primary);}
.tl-time{font-size:10.5px; color:var(--muted-light); margin-bottom:2px;}
.tl-text{font-size:12.5px; color:var(--ink); line-height:1.5;}

.action-bar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; gap:8px; padding:12px 18px; background:var(--card); border-top:1px solid var(--line); z-index:25;}
.action-bar button{flex:1; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:11px; font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink);}
.action-bar .btn-fill{background:var(--ink); color:#fff; border-color:var(--ink);}

.form-group{margin-bottom:13px;}
.form-label{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:7px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:4px;}
.num-input{font-size:19px; font-weight:700; font-family:'Fraunces',serif; padding:12px;}
.num-input:focus, .text-input:focus, .status-select:focus, .date-input:focus{outline:none; border-color:var(--primary);}
.num-input.accent{color:var(--accent);}
textarea.text-input{resize:vertical; min-height:60px; font-weight:500; font-size:13px;}

.action-list{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.action-list-item{display:flex; align-items:flex-start; gap:10px; padding:13px 15px; border-bottom:1px solid var(--line); font-size:13px;}
.action-list-item:last-child{border-bottom:none;}
.add-action{display:flex; align-items:center; justify-content:center; gap:6px; padding:12px; color:var(--primary); font-weight:700; font-size:12.5px; border:1px dashed var(--line); border-radius:10px; margin-top:9px; background:transparent; width:100%;}
.act-row-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.act-row-title{font-weight:700; color:var(--ink); font-size:12.5px;}
.act-row-meta{font-size:10.5px; color:var(--muted-light); margin-top:3px; display:flex; gap:7px; flex-wrap:wrap; align-items:center;}
.cat-pill{font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--bg); color:var(--muted); border:1px solid var(--line);}
.prio-dot{width:6px; height:6px; border-radius:50%; display:inline-block; margin-top:5px; flex-shrink:0;}
.prio-dot.haute{background:var(--danger);}
.prio-dot.moyenne{background:var(--warn);}
.prio-dot.basse{background:var(--primary);}

.week-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:10px; width:100%; text-align:left;}
.week-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.week-title{font-family:'Fraunces',serif; font-size:15px; font-weight:600;}
.week-range{font-size:11px; color:var(--muted-light);}
.mini-stats{display:flex; gap:12px; flex-wrap:wrap;}
.mini-stat{flex:1; min-width:56px;}
.mini-stat .lbl{font-size:9.5px; color:var(--muted-light); text-transform:uppercase; font-weight:700; margin-bottom:2px;}
.mini-stat .val{font-family:'Fraunces',serif; font-weight:700; font-size:14px;}
.carry-line{font-size:10.5px; color:var(--warn); font-weight:700; margin-top:8px; background:var(--warn-light); padding:5px 9px; border-radius:8px;}

.report-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px;}
.report-row{display:flex; align-items:center; gap:9px; padding:8px 0; font-size:12.5px; border-bottom:1px solid var(--line);}
.report-row:last-child{border-bottom:none;}
.report-row .icon{color:var(--muted-light);}
.report-row .n{font-family:'Fraunces',serif; font-weight:700;}

.task-item{display:flex; gap:11px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;}
.task-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); flex-shrink:0; background:var(--card); display:flex; align-items:center; justify-content:center; color:#fff; margin-top:1px;}
.task-check.checked{background:var(--primary); border-color:var(--primary);}
.task-title{font-size:13px; font-weight:700; color:var(--ink);}
.task-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.task-meta{font-size:10.5px; color:var(--muted-light); margin-top:3px;}
.tag{font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap;}
.tag.haute{background:var(--danger-light); color:var(--danger);}
.tag.moyenne{background:var(--warn-light); color:var(--warn);}
.tag.basse, .tag.done{background:var(--primary-light); color:var(--primary);}
.task-item.done .task-title{text-decoration:line-through; color:var(--muted-light);}
.subtab{display:flex; gap:6px; margin-bottom:14px;}
.subtab button{flex:1; border:1px solid var(--line); background:var(--card); padding:8px; border-radius:9px; font-size:11.5px; font-weight:700; color:var(--muted);}
.subtab button.active{background:var(--ink); border-color:var(--ink); color:#fff;}

.kpi-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
.kpi-label{font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:700; letter-spacing:.03em; margin-bottom:6px;}
.kpi-value{font-family:'Fraunces',serif; font-size:24px; font-weight:700;}
.kpi-sub{font-size:11.5px; color:var(--muted); margin-top:4px;}
.funnel-row{margin-bottom:12px;}
.funnel-bar-track{height:30px; background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.funnel-bar-fill{height:100%; border-radius:7px; display:flex; align-items:center; padding-left:11px; color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:13px; background:var(--ink);}
.funnel-conv{font-size:10.5px; color:var(--muted-light); margin-top:3px; text-align:right;}
.data-table{width:100%; border-collapse:collapse; font-size:12px;}
.data-table th{text-align:left; font-size:10px; text-transform:uppercase; color:var(--muted-light); font-weight:700; padding:0 6px 8px; letter-spacing:.03em;}
.data-table td{padding:9px 6px; border-top:1px solid var(--line); font-weight:600;}
.data-table td.num{text-align:right; font-family:'Fraunces',serif;}
.bars-mini{display:flex; align-items:flex-end; gap:8px; height:80px; padding:6px 2px;}
.bars-mini .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end; height:100%;}
.bars-mini .bfill{width:100%; background:var(--primary); border-radius:4px 4px 0 0; min-height:3px;}
.bars-mini .blbl{font-size:9.5px; color:var(--muted-light); font-weight:700;}

.login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center;}
.login-logo{font-family:'Fraunces',serif; font-size:24px; font-weight:700; color:var(--ink); margin-bottom:5px;}
.login-tag{font-size:12.5px; color:var(--muted); margin-bottom:36px;}
.user-pick{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;}
.user-pick button{display:flex; align-items:center; gap:13px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 15px; font-size:14px; font-weight:600; color:var(--ink); text-align:left;}
.user-pick button:active{border-color:var(--primary);}

.navbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; height:70px; background:var(--card); display:flex; align-items:center; justify-content:space-around; border-top:1px solid var(--line); padding-bottom:6px; z-index:30;}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9.5px; font-weight:600; color:var(--muted-light); background:none; border:none;}
.nav-item.active{color:var(--ink);}
.fab{width:48px; height:48px; border-radius:13px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; border:none; margin-top:-24px;}
.fab-float{position:fixed; right:18px; bottom:86px; margin:0; box-shadow:0 6px 18px rgba(19,42,34,.28); z-index:31;}
@media (min-width:481px){ .fab-float{right:calc(50% - 240px + 18px);} }

.modal-overlay{position:fixed; inset:0; background:rgba(19,42,34,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--bg); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 18px 24px; max-height:88vh; overflow-y:auto;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-title{font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
.close-btn{width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink);}
.error-text{color:var(--danger); font-size:11.5px; margin-top:-7px; margin-bottom:9px;}
.primary-btn{width:100%; border:none; background:var(--ink); color:#fff; padding:14px; border-radius:11px; font-size:13.5px; font-weight:700; margin-top:6px;}
.primary-btn:disabled{opacity:.45;}
.secondary-btn{width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:13px; border-radius:11px; font-size:13px; font-weight:700; margin-top:8px;}

<script>
(function(){

// ============================================================
// TEMPS RÉEL — aucune date n'est codée en dur. Tout dérive de
// "aujourd'hui", calculé au chargement de la page.
// ============================================================
const TODAY = new Date();
const MONTH_NAMES = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAY_NAMES = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function pad(n){ return n<10?'0'+n:''+n; }
function monthKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthKeyParts(key){ const [y,m]=key.split('-').map(Number); return {y,m}; }
function monthLabel(key){ const {y,m}=monthKeyParts(key); return MONTH_NAMES[m-1][0].toUpperCase()+MONTH_NAMES[m-1].slice(1)+' '+y; }
function addMonthsToKey(key,delta){ let {y,m}=monthKeyParts(key); m+=delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+pad(m); }
function firstDayOfMonth(key){ const {y,m}=monthKeyParts(key); return new Date(y,m-1,1); }
function lastDayOfMonth(key){ const {y,m}=monthKeyParts(key); return new Date(y,m,0); }
function fmtShort(d){ return d.getDate()+' '+MONTH_NAMES[d.getMonth()].slice(0,3)+'.'; }
function fmtFull(d){ return d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear(); }
function fmtWeekday(d){ return DAY_NAMES[d.getDay()][0].toUpperCase()+DAY_NAMES[d.getDay()].slice(1); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isPast(d){ const t=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()); const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return dd<t; }
function toInputDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromInputDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

const CURRENT_MONTH_KEY = monthKey(TODAY);

// Génère les semaines réelles du mois (lundi→dimanche, bornées au mois).
function generateWeeks(key){
  const start = firstDayOfMonth(key), end = lastDayOfMonth(key);
  const weeks = []; let cursor = new Date(start); let n=1;
  while(cursor<=end){
    const wDay = cursor.getDay();
    const toSunday = wDay===0?0:7-wDay;
    let weekEnd = new Date(cursor); weekEnd.setDate(weekEnd.getDate()+toSunday);
    if(weekEnd>end) weekEnd=new Date(end);
    weeks.push({
      id:key+'-S'+n, num:n, start:new Date(cursor), end:new Date(weekEnd),
      objectives:{prospects:0,contacts:0,propositions:0,negociations:0,contrats:0},
      results:{prospects:0,contacts:0,propositions:0,negociations:0,contrats:0},
      focus:'', cible:'', strategie:'', closed:false, bilan:null, actions:[],
      objectiveHistory:[], // révisions de l'objectif "prospects" — {date, from, to}
    });
    cursor=new Date(weekEnd); cursor.setDate(cursor.getDate()+1); n++;
  }
  return weeks;
}

// ============================================================
// DONNÉES — l'application démarre vide. Tout ce qui apparaît
// vient de ce que l'utilisateur saisit lui-même.
// ============================================================
const USERS = [
  { id:'rodolpho', name:'Rodolpho', initials:'RO', email:'rodolphomicorason@gmail.com' },
  { id:'rodolphe', name:'Rodolphe', initials:'RH', email:'rosaphnil@gmail.com' },
  { id:'shadrac',  name:'Shadrac',  initials:'SH', email:'chadracsehlin@gmail.com' },
];

const MONTHS = {}; // clé "YYYY-MM" → plan du mois, généré à la demande
function getMonthPlan(key){
  if(!MONTHS[key]){
    MONTHS[key] = {
      key, objectives:{prospects:0,contacts:0,propositions:0,negociations:0,contrats:0},
      priorities:[], weeks:generateWeeks(key),
      cible:'', strategie:'', canaux:[], // stratégie mensuelle — base de l'exécution hebdomadaire
      individualObjectives:{}, // objectifs "prospects" définis manuellement par commercial
      objectiveHistory:[], // révisions de l'objectif mensuel "prospects"
    };
  }
  return MONTHS[key];
}
function monthStatus(key){ return key<CURRENT_MONTH_KEY?'clos':(key===CURRENT_MONTH_KEY?'en_cours':'planification'); }
// Charge de la semaine = objectif planifié + report, mais l'objectif
// affiché/officiel ne change jamais automatiquement (règle explicite).
function weekObjectivesSum(monthPlan){ return monthPlan.weeks.reduce((s,w)=>s+w.objectives.prospects,0); }

const IND = ['prospects','contacts','propositions','negociations','contrats'];
const IND_META = {
  prospects:{label:'Nouveaux prospects', short:'Prospects'}, contacts:{label:'Prospects contactés', short:'Contacts'},
  propositions:{label:'Propositions envoyées', short:'Propositions'}, negociations:{label:'Négociations en cours', short:'Négociations'},
  contrats:{label:'Contrats signés', short:'Contrats'},
};
const PRIORITY_META = { p1:{label:'P1 — Critique'}, p2:{label:'P2 — Important'}, p3:{label:'P3 — Normal'} };

// Pipeline : la Relance n'est pas une étape, c'est un type d'action.
const STATUS_META = {
  nouveau:     { label:'Nouveau',      order:0 },
  contacte:    { label:'Contacté',     order:1 },
  interesse:   { label:'Intéressé',    order:2 },
  proposition: { label:'Proposition',  order:3 },
  negociation: { label:'Négociation',  order:4 },
  signe:       { label:'Contrat signé',order:5 },
  perdu:       { label:'Perdu',        order:6 },
};
const TEMP_META = { chaud:{label:'Chaud'}, tiede:{label:'Tiède'}, froid:{label:'Froid'} };
const SOURCE_LABELS = ['Recommandation','Facebook','WhatsApp','Événement','Prospection directe','Site web','Autre'];
const CATEGORY_LABELS = ['Prospection','Appel','WhatsApp','Relance','Rendez-vous','Présentation','Proposition','Négociation','Suivi','Autre'];
const STATUS_ACTION_LABEL = { a_faire:'À faire', en_cours:'En cours', terminee:'Terminée', reportee:'Reportée', annulee:'Annulée' };

let PROSPECTS = [];
let ACTIVITY_FEED = [];

// ============================================================
// SYNCHRONISATION FIRESTORE — collection "prospects" uniquement
// pour cette étape. Le Plan, les Semaines et les Actions restent
// en mémoire locale et seront branchés dans une étape suivante.
// ============================================================
let FB_READY = false;
function fbReady(){ return FB_READY && window.__fb; }

// Un prospect contient des dates (objets Date) que Firestore stocke
// mal nativement dans notre usage ici — on les sérialise en ISO string
// à l'écriture, et on les redéserialise en Date à la lecture.
function serializeProspect(p){
  const copy = { ...p };
  delete copy.id;
  copy.createdAt = p.createdAt ? p.createdAt.toISOString() : null;
  copy.lastInteraction = p.lastInteraction ? p.lastInteraction.toISOString() : null;
  copy.convertedAt = p.convertedAt ? p.convertedAt.toISOString() : null;
  copy.history = (p.history||[]).map(h=>({...h, date: h.date ? new Date(h.date).toISOString() : null}));
  return copy;
}
function deserializeProspect(data, id){
  return {
    ...data, id,
    createdAt: data.createdAt ? new Date(data.createdAt) : new Date(),
    lastInteraction: data.lastInteraction ? new Date(data.lastInteraction) : new Date(),
    convertedAt: data.convertedAt ? new Date(data.convertedAt) : null,
    history: (data.history||[]).map(h=>({...h, date: h.date ? new Date(h.date) : new Date()})),
  };
}
// Écriture "tir et oublie" : la mise à jour visible à l'écran se fait
// immédiatement en local (déjà fait par l'appelant), Firestore
// synchronise en arrière-plan vers les deux autres utilisateurs.
function saveProspect(p){
  if(!fbReady()) return;
  const fb = window.__fb;
  updateDocSafe(fb.doc(fb.db,'prospects',p.id), serializeProspect(p));
}
function updateDocSafe(ref, data){
  window.__fb.updateDoc(ref, data).catch(err=>console.error('Firestore update error', err));
}
async function createProspectRemote(p){
  const fb = window.__fb;
  const ref = await fb.addDoc(fb.collection(fb.db,'prospects'), serializeProspect(p));
  return ref.id;
}
function deleteProspectRemote(id){
  if(!fbReady()) return;
  const fb = window.__fb;
  fb.deleteDoc(fb.doc(fb.db,'prospects',id)).catch(err=>console.error('Firestore delete error', err));
}
function startProspectsSync(){
  const fb = window.__fb;
  fb.onSnapshot(fb.collection(fb.db,'prospects'), snapshot=>{
    PROSPECTS = snapshot.docs.map(d=>deserializeProspect(d.data(), d.id));
    paint();
  }, err=>console.error('Firestore sync error', err));
}
function initFirebase(){
  FB_READY = true;
  startProspectsSync();
  startAuthSync();
}
if(window.__fb) initFirebase();
else window.addEventListener('rp:fb-ready', initFirebase, {once:true});

// ============================================================
// AUTHENTIFICATION — email/mot de passe, un compte réel par personne.
// L'identité affichée dans l'app est déduite de l'email connecté,
// jamais d'un simple clic sans preuve d'identité.
// ============================================================
function startAuthSync(){
  const fb = window.__fb;
  fb.onAuthStateChanged(fb.auth, fbUser=>{
    if(fbUser){
      const matched = USERS.find(u=>u.email.toLowerCase()===(fbUser.email||'').toLowerCase());
      state.currentUser = matched || null;
      if(state.screen==='login') setScreen('dashboard'); else paint();
    } else {
      state.currentUser = null;
      if(state.screen!=='login') setScreen('login');
    }
  });
}
async function loginWithPassword(email, password){
  const fb = window.__fb;
  await fb.signInWithEmailAndPassword(fb.auth, email, password);
}
function logout(){
  if(fbReady()) window.__fb.signOut(window.__fb.auth).catch(err=>console.error('Erreur déconnexion', err));
  state.currentUser = null;
  setScreen('login');
}

// ============================================================
// UTILITAIRES
// ============================================================
function pct(part,total){ if(!total) return 0; return Math.min(100, Math.round((part/total)*100)); }
function paceClass(done,target){
  const ratio = target ? done/target : (done>0?1:0);
  if(ratio>=0.9) return 'ok';
  if(ratio>=0.6) return 'warn';
  return 'danger';
}
function userById(id){ return USERS.find(u=>u.id===id); }
function primaryProject(p){ return p.projects && p.projects.length ? p.projects[p.projects.length-1].title : ''; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function icon(name,cls){ return `<svg class="icon ${cls||''}"><use href="#i-${name}"/></svg>`; }
function isActive(p){ return !['signe','perdu'].includes(p.status); }
function isClient(p){ return p.status==='signe'; }
// Source unique de vérité : la "prochaine action" d'un prospect n'est
// jamais stockée à part — c'est la première action réelle, non terminée,
// liée à ce prospect. La modifier ou la terminer n'importe où (fiche,
// Actions, semaine) la modifie partout, puisque c'est le même objet.
function nextActionFor(p){
  const acts = allActionsFlat().filter(a=>a.prospectId===p.id && a.status!=='terminee' && a.status!=='annulee');
  if(!acts.length) return null;
  return acts.sort((a,b)=>a.date-b.date)[0];
}
function riskInfo(p){
  if(!isActive(p)) return null;
  const na = nextActionFor(p);
  if(!na) return { reason:'Aucune prochaine action définie.' };
  if(isPast(na.date)){
    const days = Math.round((new Date(TODAY)-na.date)/86400000);
    return { reason:`Action "${na.title}" en retard de ${days} jour${days>1?'s':''}.` };
  }
  if(p.status==='proposition'){
    const days = Math.round((new Date(TODAY)-p.lastInteraction)/86400000);
    if(days>=5) return { reason:`Proposition envoyée il y a ${days} jours sans suivi rapproché.` };
  }
  if(p.temperature==='chaud'){
    const days = Math.round((new Date(TODAY)-p.lastInteraction)/86400000);
    if(days>=5) return { reason:`Prospect chaud sans interaction depuis ${days} jours.` };
  }
  return null;
}
function isRisky(p){ return !!riskInfo(p); }
// La conversion en client est un événement métier contrôlé, pas un
// simple changement de statut parmi d'autres : elle exige une
// confirmation et enregistre la date de conversion.
function convertToClient(p){
  p.status='signe'; p.convertedAt = new Date(TODAY);
  markMilestone(p,'contrats');
  p.history.unshift({date:TODAY, text:'Contrat signé — conversion en client. Historique et informations conservés.', user:state.currentUser.name});
  logActivity(`${state.currentUser.name} a converti ${p.name} en client.`, 'check');
  saveProspect(p);
}
function recordObjectiveRevision(target, key, newValue){
  if(!target.objectiveHistory) target.objectiveHistory=[];
  const from = target.objectives[key];
  if(from===newValue) return;
  // La toute première définition (depuis zéro) n'est pas une "révision" —
  // seule une modification d'un objectif déjà fixé est tracée comme telle.
  if(from>0){
    if(target.objectiveHistory.length===0) target.objectiveHistory.push({date:new Date(TODAY), initial:from, from, to:newValue});
    else target.objectiveHistory.push({date:new Date(TODAY), from, to:newValue});
  }
  target.objectives[key]=newValue;
}

// ============================================================
// DONNÉES DE DÉMONSTRATION — jamais chargées automatiquement.
// Raconte une histoire commerciale cohérente sur ~3 semaines :
// acquisition, suivi, négociations, une conversion en client, un
// prospect perdu, une semaine passée partiellement atteinte avec
// un report réel (prospect + action) vers la semaine en cours, et
// une projection pour le mois suivant. Tous les compteurs sont
// alimentés par les mêmes événements que ceux affichés (prospects,
// statuts, actions) — aucun chiffre n'est posé "à part".
// ============================================================
let DEMO_MODE = false;
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function seedIncrement(date, key){
  const mp = getMonthPlan(monthKey(date));
  const w = findWeekForDate(mp, date);
  if(w) w.results[key] = (w.results[key]||0)+1;
}
function prevWeekRef(monthPlan, idx){
  if(idx>0) return { mp:monthPlan, idx:idx-1 };
  const pmp = getMonthPlan(addMonthsToKey(monthPlan.key,-1));
  return pmp.weeks.length ? { mp:pmp, idx:pmp.weeks.length-1 } : null;
}

async function seedDemoData(){
  DEMO_MODE = true;
  const monthPlan = getMonthPlan(CURRENT_MONTH_KEY);
  monthPlan.objectives = { prospects:25, contacts:18, propositions:6, negociations:5, contrats:3 };
  monthPlan.cible = 'Auteurs indépendants ayant un manuscrit terminé ou en phase finale';
  monthPlan.strategie = 'Prioriser les recommandations et les événements ; relancer systématiquement toute proposition sous 72h';
  monthPlan.canaux = ['Recommandation','Facebook','Événement'];
  monthPlan.individualObjectives = { rodolphe:10, rodolpho:9 }; // Shadrac volontairement sans objectif défini

  const users = ['rodolpho','rodolphe','shadrac'];

  // ---- Le récit : 12 prospects, à des étapes, priorités et températures variées ----
  const stories = [
    // nom, projet, source, responsable, température, priorité, jalons {statut:offsetJours}, prochaine action {titre, offsetJours} ou null, note narrative
    { name:'Amadou Bello', project:'Sagesse africaine — recueil de proverbes', source:'Recommandation', resp:'rodolphe', temp:'chaud', prio:'p2',
      steps:{contacte:-14, interesse:-11, proposition:-8, negociation:-5, signe:-2}, next:null,
      note:'Converti en client — contrat signé il y a 2 jours.' },
    { name:'Paul Nassara', project:'Essai politique — vingt ans de vie publique', source:'Prospection directe', resp:'rodolphe', temp:'chaud', prio:'p1',

function isToConvert(p){ return isActive(p) && ['interesse','proposition','negociation'].includes(p.status); }
function findWeekForDate(monthPlan, date){ return monthPlan.weeks.find(w=>date>=w.start && date<=w.end); }
function getCurrentWeek(){ return findWeekForDate(getMonthPlan(CURRENT_MONTH_KEY), TODAY); }
function allActionsFlat(){
  const out=[];
  Object.values(MONTHS).forEach(m=>m.weeks.forEach(w=>w.actions.forEach(a=>out.push({...a, weekId:w.id, weekNum:w.num, monthKey:m.key}))));
  return out;
}
function findActionOwner(actionId){
  for(const m of Object.values(MONTHS)) for(const w of m.weeks){ const a=w.actions.find(x=>x.id===actionId); if(a) return {action:a, week:w}; }
  return null;
}

// Reporte le déficit d'une semaine à la suivante — y compris d'un mois
// au suivant (S1 de septembre récupère le report de la dernière semaine
// d'août). L'objectif planifié affiché reste toujours celui saisi :
// on distingue Objectif planifié / Report / Charge totale (adjusted).
function weekComputed(monthPlan, index){
  const w = monthPlan.weeks[index];
  let prev = null;
  if(index>0){ prev = weekComputed(monthPlan, index-1); }
  else {
    const prevKey = addMonthsToKey(monthPlan.key,-1);
    if(MONTHS[prevKey] && MONTHS[prevKey].weeks.length){ const pm=MONTHS[prevKey]; prev = weekComputed(pm, pm.weeks.length-1); }
  }
  const carry = {};
  IND.forEach(k=> carry[k] = prev ? Math.max(0, prev.objectives[k]-prev.results[k]) : 0);
  const adjusted={}; IND.forEach(k=>adjusted[k]=w.objectives[k]+carry[k]);
  return { ...w, carry, adjusted };
}

function monthResultsTotal(monthPlan){
  const t={prospects:0,contacts:0,propositions:0,negociations:0,contrats:0};
  monthPlan.weeks.forEach(w=>IND.forEach(k=>t[k]+=w.results[k]));
  return t;
}

// Report commercial "niveau 2" : les prospects réels à poursuivre, pas
// seulement un chiffre. Un prospect créé en août reste le même prospect
// en septembre — jamais recréé, jamais recompté comme nouveau.
function conversionSnapshot(){
  return {
    interesses: PROSPECTS.filter(p=>p.status==='interesse').length,
    propositions: PROSPECTS.filter(p=>p.status==='proposition').length,
    negociations: PROSPECTS.filter(p=>p.status==='negociation').length,
    aConvertir: PROSPECTS.filter(isToConvert).length,
    risque: PROSPECTS.filter(isRisky).length,
    sansAction: PROSPECTS.filter(p=>isActive(p) && !nextActionFor(p)).length,
  };
}
function prospectsAPoursuivre(){
  return PROSPECTS.filter(isToConvert).map(p=>({p, na:nextActionFor(p)})).sort((a,b)=>(a.na?a.na.date:0)-(b.na?b.na.date:0)).map(x=>x.p);
}

// Alertes commerciales générées dynamiquement — disparaissent d'elles-
// mêmes dès que la situation qui les a produites change.
function computeAlerts(){
  const alerts=[];
  const risky = PROSPECTS.filter(isRisky);
  if(risky.length) alerts.push({text:`${risky.length} prospect(s) à risque nécessitent une attention`, severity:'danger'});
  const lateActions = allActionsFlat().filter(a=>isPast(a.date) && a.status!=='terminee' && a.status!=='annulee');
  if(lateActions.length) alerts.push({text:`${lateActions.length} action(s) en retard`, severity:'danger'});
  const monthPlan = getMonthPlan(CURRENT_MONTH_KEY);
  const curWeek = getCurrentWeek();
  if(curWeek){
    const idx = monthPlan.weeks.findIndex(w=>w.id===curWeek.id);
    const wc = weekComputed(monthPlan, idx);
    const daysElapsed = Math.max(1,(TODAY-curWeek.start)/86400000+1);
    const daysTotal = (curWeek.end-curWeek.start)/86400000+1;
    const expected = wc.adjusted.prospects*(daysElapsed/daysTotal);
    if(wc.results.prospects < expected*0.7) alerts.push({text:`Objectif hebdomadaire de prospection en retard`, severity:'warn'});
  }
  const sumWeeks = weekObjectivesSum(monthPlan);
  if(monthPlan.objectives.prospects>0 && sumWeeks!==monthPlan.objectives.prospects) alerts.push({text: sumWeeks<monthPlan.objectives.prospects ? `${monthPlan.objectives.prospects-sumWeeks} prospects restent à répartir sur les semaines` : `La répartition hebdomadaire dépasse l'objectif mensuel de ${sumWeeks-monthPlan.objectives.prospects}`, severity:'warn'});
  if(monthPlan.objectives.prospects===0) alerts.push({text:'Planification mensuelle incomplète — objectif non défini', severity:'neutral'});
  return alerts;
}

// Détection de doublon à la création — téléphone, email, ou nom très proche.
function findPossibleDuplicate(name, phone, email){
  const n = name.trim().toLowerCase(), ph = phone.replace(/[^0-9]/g,''), em = email.trim().toLowerCase();
  return PROSPECTS.find(p=>{
    if(ph && p.phone && p.phone.replace(/[^0-9]/g,'')===ph) return true;
    if(em && p.email && p.email.toLowerCase()===em) return true;
    if(p.name.trim().toLowerCase()===n) return true;
    return false;
  });
}

// Comptage sans doublon : chaque jalon n'incrémente qu'une fois.
function markMilestone(p, key){
  if(!p.milestones) p.milestones={};
  if(p.milestones[key]) return;
  p.milestones[key]=true;
  const w = getCurrentWeek();
  if(w) w.results[key] = (w.results[key]||0)+1;
}

  wrap.querySelector('#go-profile').addEventListener('click', ()=>setScreen('profil'));
  wrap.querySelector('#go-notif').addEventListener('click', ()=>setScreen('notifications'));

  wrap.querySelector('#go-convert').addEventListener('click', ()=>{ state.prospectFilter='convertir'; state.pcTab='prospects'; setScreen('prospects-clients'); });
  wrap.querySelector('#go-today').addEventListener('click', ()=>{ state.actionsTab='aujourdhui'; setScreen('actions'); });

  root.appendChild(wrap);

function renderPlan(){
  root.innerHTML='';
  const key = state.viewMonthKey;
  const monthPlan = getMonthPlan(key);
  const status = monthStatus(key);
  const statusLabel = status==='clos'?'Terminé':(status==='en_cours'?'En cours':'Planification');
  const statusClass = status==='clos'?'neutral':(status==='en_cours'?'ok':'warn');

  const wrap = el(`
    <div>
      <div class="topbar">
        <span class="voice" style="font-size:14px;font-weight:600;">RHEMA PILOT</span>
        <button class="icon-btn dot" id="go-notif">${icon('bell')}</button>
      </div>
      <div class="month-switch">
        <button id="prev-month">${icon('chevron-left')}</button>
        <span class="m-label">${monthLabel(key)}</span>
        <button id="next-month">${icon('chevron-right')}</button>
      </div>
      <div class="page-title">Plan <span class="status-pill ${statusClass}">${statusLabel}</span></div>
      <div class="page-sub">Nouveaux prospects → objectif principal du mois</div>

      <div class="form-group">
        <div class="form-label">${icon('target','icon-sm')} Nouveaux prospects (objectif principal)</div>
        <input class="num-input accent" type="number" min="0" id="obj-main" value="${monthPlan.objectives.prospects}">
      </div>
      <div id="coherence-banner"></div>
      <div class="form-grid" id="obj-grid"></div>

      <div class="section-title"><span>Stratégie du mois</span></div>
      <div class="form-group"><div class="form-label">Cible</div><input class="text-input" id="m-cible" placeholder="Quel type de prospects viser ce mois-ci ?" value="${esc(monthPlan.cible)}"></div>
      <div class="form-group"><div class="form-label">Stratégie</div><input class="text-input" id="m-strategie" placeholder="Comment atteindre l'objectif ?" value="${esc(monthPlan.strategie)}"></div>
      <div class="form-group"><div class="form-label">Canaux de prospection</div><div class="filters" id="canaux-chips" style="margin-bottom:0;"></div></div>

      <div class="section-title"><span>Priorités du mois</span></div>
      <div class="action-list" id="priority-list"></div>
      <button class="add-action" id="add-priority">${icon('plus','icon-sm')} Ajouter une priorité</button>

      <div class="section-title"><span>Objectifs individuels — prospects</span></div>
      <div class="metric-list" id="individual-objectives" style="margin-bottom:6px;"></div>

      <div class="section-title" style="margin-top:22px;"><span>Semaines — exécution du plan mensuel</span></div>
      <div class="page-sub" style="margin-top:-4px;">Chaque semaine ci-dessous exécute progressivement l'objectif et la stratégie définis plus haut.</div>
      <div id="weeks"></div>
    </div>`);

  wrap.querySelector('#obj-main').addEventListener('change', e=>{ const v=parseInt(e.target.value,10)||0; recordObjectiveRevision(monthPlan,'prospects',v); renderPlan(); });

  const coherence = wrap.querySelector('#coherence-banner');
  function paintCoherence(){
    coherence.innerHTML='';
    const sum = weekObjectivesSum(monthPlan);
    if(monthPlan.objectives.prospects>0 && sum!==monthPlan.objectives.prospects){
      const under = sum<monthPlan.objectives.prospects;
      coherence.appendChild(el(`<div class="report-card" style="margin-bottom:14px;"><div class="report-row" style="border:none;">${icon('alert','icon-sm')} ${under?`${monthPlan.objectives.prospects-sum} prospects restent à répartir sur les semaines.`:`La répartition hebdomadaire dépasse l'objectif mensuel de ${sum-monthPlan.objectives.prospects}.`}</div></div>`));
    }
  }
  paintCoherence();

  wrap.querySelector('#m-cible').addEventListener('input', e=>monthPlan.cible=e.target.value);
  wrap.querySelector('#m-strategie').addEventListener('input', e=>monthPlan.strategie=e.target.value);
  const canauxChips = wrap.querySelector('#canaux-chips');
  SOURCE_LABELS.forEach(c=>{
    const chip = el(`<span class="chip ${monthPlan.canaux.includes(c)?'active':''}">${c}</span>`);
    chip.addEventListener('click', ()=>{ if(monthPlan.canaux.includes(c)) monthPlan.canaux=monthPlan.canaux.filter(x=>x!==c); else monthPlan.canaux.push(c); chip.classList.toggle('active'); });
    canauxChips.appendChild(chip);
  });

  const indivEl = wrap.querySelector('#individual-objectives');
  USERS.forEach(u=>{
    const row = el(`
      <div class="metric-row">
        <div class="metric-top"><span class="metric-label">${u.name}</span></div>
        <input class="text-input" type="number" min="0" style="max-width:100px; padding:8px 10px; font-weight:700;" value="${monthPlan.individualObjectives[u.id]||0}">
      </div>`);
    row.querySelector('input').addEventListener('input', e=>{ monthPlan.individualObjectives[u.id]=parseInt(e.target.value,10)||0; });
    indivEl.appendChild(row);
  });

  const objGrid = wrap.querySelector('#obj-grid');
  [['contacts','Contacts'],['propositions','Propositions'],['negociations','Négociations'],['contrats','Contrats']].forEach(([k,label])=>{
    const group = el(`<div class="form-group"><div class="form-label">${label}</div><input class="num-input" style="font-size:16px;" type="number" min="0" value="${monthPlan.objectives[k]}"></div>`);
    group.querySelector('input').addEventListener('input', e=>{ const v=parseInt(e.target.value,10); monthPlan.objectives[k]=isNaN(v)?0:v; });
    objGrid.appendChild(group);
  });

  const priorityList = wrap.querySelector('#priority-list');
  function paintPriorities(){
    priorityList.innerHTML='';
    if(!monthPlan.priorities.length){ priorityList.appendChild(el(`<div style="padding:14px 15px; font-size:12px; color:var(--muted-light);">Aucune priorité définie.</div>`)); return; }
    monthPlan.priorities.forEach(p=>priorityList.appendChild(el(`<div class="action-list-item"><span>${esc(p.title)}</span></div>`)));
  }
  paintPriorities();
  wrap.querySelector('#add-priority').addEventListener('click', ()=>{
    const title = prompt('Priorité du mois :');
    if(title && title.trim()){ monthPlan.priorities.push({id:'pr'+Date.now(), title:title.trim()}); paintPriorities(); }
  });

  const weeksEl = wrap.querySelector('#weeks');
  monthPlan.weeks.forEach((w,i)=>{
    const wc = weekComputed(monthPlan,i);
    const isCurrent = TODAY>=w.start && TODAY<=w.end;
    const p = pct(wc.results.prospects, wc.adjusted.prospects);
    const carryTotal = IND.reduce((s,k)=>s+wc.carry[k],0);
    const card = el(`
      <button class="week-card">
        <div class="week-top">
          <div><div class="week-title">Semaine ${w.num} ${isCurrent?'· en cours':(w.closed?'· clôturée':'')}</div><div class="week-range">${fmtShort(w.start)} – ${fmtShort(w.end)}</div></div>
          <span class="status-pill ${w.closed?'neutral':(isCurrent?'ok':'neutral')}">${w.closed?p+'%':(isCurrent?'En cours':'À venir')}</span>
        </div>
        ${w.focus ? `<div style="font-size:11.5px;color:var(--muted); margin-bottom:8px;">${esc(w.focus)}</div>` : ''}
        <div class="mini-stats">
          <div class="mini-stat"><div class="lbl">Prospects</div><div class="val">${wc.results.prospects}/${wc.adjusted.prospects}</div></div>
          <div class="mini-stat"><div class="lbl">Contacts</div><div class="val">${wc.results.contacts}/${wc.adjusted.contacts}</div></div>
          <div class="mini-stat"><div class="lbl">RDV</div><div class="val">${wc.results.rdv}/${wc.adjusted.rdv}</div></div>
          <div class="mini-stat"><div class="lbl">Contrats</div><div class="val">${wc.results.contrats}/${wc.adjusted.contrats}</div></div>
        </div>
        ${carryTotal>0 ? `<div class="carry-line">Inclut ${carryTotal} report(s) de la semaine ${w.num-1}</div>` : ''}
      </button>`);
    card.addEventListener('click', ()=>setScreen('semaine',{monthKey:key, num:w.num}));
    weeksEl.appendChild(card);
  });

  wrap.querySelector('#go-notif').addEventListener('click', ()=>setScreen('notifications'));
  wrap.querySelector('#prev-month').addEventListener('click', ()=>{ state.viewMonthKey=addMonthsToKey(key,-1); renderPlan(); });
  wrap.querySelector('#next-month').addEventListener('click', ()=>{ state.viewMonthKey=addMonthsToKey(key,1); renderPlan(); });

  root.appendChild(wrap);
}

function renderSemaine(){
  root.innerHTML='';
  const monthPlan = getMonthPlan(state.params.monthKey);
  const idx = monthPlan.weeks.findIndex(w=>w.num===state.params.num);
  if(idx===-1){ setScreen('plan'); return; }
  const w = monthPlan.weeks[idx];
  const wc = weekComputed(monthPlan, idx);
  const snap = conversionSnapshot();
  const isCurrent = TODAY>=w.start && TODAY<=w.end;

  const wrap = el(`
    <div>
      <div class="topbar"><button class="icon-btn" id="back">${icon('chevron-left')}</button><span class="voice" style="font-size:14px;font-weight:600;">Semaine ${w.num}</span><span style="width:34px;"></span></div>
      <div class="page-title">${fmtShort(w.start)} – ${fmtShort(w.end)} <span class="status-pill ${w.closed?'neutral':(isCurrent?'ok':'neutral')}">${w.closed?'Clôturée':(isCurrent?'En cours':'À venir')}</span></div>

      ${idx>0 && IND.some(k=>wc.carry[k]>0) ? `
      <div class="section-title"><span>Report de la semaine ${w.num-1}</span></div>
      <div class="report-card">${IND.filter(k=>wc.carry[k]>0).map(k=>`<div class="report-row">${icon('alert','icon-sm')} <span class="n">${wc.carry[k]}</span> ${IND_META[k].short.toLowerCase()}</div>`).join('')}</div>` : ''}

      <div class="section-title"><span>Acquisition — nouveaux prospects</span></div>
      <div class="form-grid" id="acq-grid"></div>
      ${idx>0 ? `<div class="page-sub" style="margin-top:-6px;">${w.objectives.prospects} nouveaux + ${wc.carry.prospects} reportés = <b>${wc.adjusted.prospects}</b> à traiter</div>` : ''}

      <div class="section-title"><span>Conversion — prospects existants à faire progresser</span></div>
      <div class="report-card">
        <div class="report-row">${icon('users','icon-sm')} <span class="n">${snap.interesses}</span> intéressés à relancer</div>
        <div class="report-row">${icon('message','icon-sm')} <span class="n">${snap.propositions}</span> propositions à suivre</div>
        <div class="report-row">${icon('clock','icon-sm')} <span class="n">${snap.negociations}</span> négociations à poursuivre</div>
      </div>
      <div class="list-card" id="to-convert-list" style="margin-bottom:14px;"></div>

      <div class="section-title"><span>Focus de la semaine</span></div>
      <div class="form-group"><textarea class="text-input" id="w-focus" placeholder="Quel est le résultat prioritaire de cette semaine ?">${esc(w.focus)}</textarea></div>
      <div class="form-group"><div class="form-label">Cible</div><input class="text-input" id="w-cible" placeholder="Quel type de prospects viser ?" value="${esc(w.cible)}"></div>
      <div class="form-group"><div class="form-label">Stratégie</div><input class="text-input" id="w-strategie" placeholder="Comment les atteindre ?" value="${esc(w.strategie)}"></div>

      <div class="section-title"><span>Actions de la semaine</span></div>
      <div class="action-list" id="w-actions"></div>
      <button class="add-action" id="w-add-action">${icon('plus','icon-sm')} Ajouter une action</button>

      <button class="primary-btn" id="close-week-btn" style="margin-top:18px;" ${w.closed?'disabled':''}>${w.closed?'Semaine déjà clôturée':'Clôturer la semaine'}</button>
      ${w.closed ? `<button class="secondary-btn" id="see-bilan">Voir le bilan</button>` : ''}
    </div>`);

  const acqGrid = wrap.querySelector('#acq-grid');
  IND.forEach(k=>{
    const group = el(`<div class="form-group"><div class="form-label">${IND_META[k].short}</div><input class="num-input ${k==='prospects'?'accent':''}" style="${k!=='prospects'?'font-size:16px;':''}" type="number" min="0" value="${w.objectives[k]}"></div>`);
    group.querySelector('input').addEventListener('change', e=>{
      const v=parseInt(e.target.value,10)||0;
      if(k==='prospects') recordObjectiveRevision(w,'prospects',v); else w.objectives[k]=v;
    });
    acqGrid.appendChild(group);
  });
  if(w.objectiveHistory && w.objectiveHistory.length){
    const hist = w.objectiveHistory[w.objectiveHistory.length-1];
    wrap.querySelector('#acq-grid').insertAdjacentElement('afterend', el(`<div class="page-sub" style="margin-top:-6px;">Objectif initial : ${hist.initial!==undefined?hist.initial:hist.from} — révisé à ${w.objectives.prospects} le ${fmtShort(hist.date)}</div>`));
  }

  const convertList = wrap.querySelector('#to-convert-list');
  const toConvert = prospectsAPoursuivre();
  if(!toConvert.length){ convertList.appendChild(el(`<div class="empty" style="padding:22px;"><div>Aucun prospect à poursuivre pour l'instant.</div></div>`)); }
  toConvert.slice(0,8).forEach(p=>{
    const na = nextActionFor(p);
    const row = el(`<div class="list-row" style="cursor:pointer;"><div class="row-icon">${icon('users','icon-sm')}</div><div style="flex:1;"><div class="row-text">${esc(p.name)} — ${STATUS_META[p.status].label}</div><div class="row-time">${na?('Prochaine action : '+esc(na.title)+' — '+fmtShort(na.date)):'Aucune prochaine action'}</div></div></div>`);
    row.addEventListener('click', ()=>setScreen('prospect-detail',{id:p.id}));
    convertList.appendChild(row);
    if(!na){
      const planBtn = el(`<button class="secondary-btn" style="margin:-6px 0 8px;">Planifier dans ma semaine</button>`);
      planBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openActionModal({ week:w, presetProspectId:p.id, onSave:(a)=>{ w.actions.push(a); renderSemaine(); } }); });
      convertList.appendChild(planBtn);
    }
  });

  wrap.querySelector('#w-focus').addEventListener('input', e=>w.focus=e.target.value);
  wrap.querySelector('#w-cible').addEventListener('input', e=>w.cible=e.target.value);
  wrap.querySelector('#w-strategie').addEventListener('input', e=>w.strategie=e.target.value);

  const actionsList = wrap.querySelector('#w-actions');
  function paintActions(){
    actionsList.innerHTML='';
    if(!w.actions.length){ actionsList.appendChild(el(`<div style="padding:14px 15px; font-size:12px; color:var(--muted-light);">Aucune action planifiée pour cette semaine.</div>`)); return; }
    w.actions.forEach(a=>{
      const resp = userById(a.responsable);
      const late = a.status!=='terminee' && a.status!=='annulee' && isPast(a.date);
      const item = el(`
        <div class="action-list-item">
          <span class="prio-dot ${a.priority}"></span>
          <div style="flex:1;">
            <div class="act-row-top"><span class="act-row-title">${esc(a.title)}</span><span class="tag ${a.status==='terminee'?'done':a.priority}">${late?'En retard':STATUS_ACTION_LABEL[a.status]}</span></div>
            <div class="act-row-meta"><span class="cat-pill">${esc(a.category)}</span><span>${resp?resp.name:''}</span><span>${fmtShort(a.date)}</span></div>
          </div>
        </div>`);
      item.addEventListener('click', ()=>{
        if(a.status==='terminee'){ a.status='a_faire'; }
        else { completeAction(a); }
        paintActions();
      });
      actionsList.appendChild(item);
    });
  }
  paintActions();

  wrap.querySelector('#w-add-action').addEventListener('click', ()=>openActionModal({ week:w, onSave:(a)=>{ w.actions.push(a); paintActions(); } }));
  wrap.querySelector('#back').addEventListener('click', ()=>setScreen('plan'));
  wrap.querySelector('#close-week-btn').addEventListener('click', ()=>{ if(!w.closed) setScreen('bilan-semaine',{monthKey:monthPlan.key, num:w.num}); });
  const seeBilan = wrap.querySelector('#see-bilan'); if(seeBilan) seeBilan.addEventListener('click', ()=>setScreen('bilan-semaine',{monthKey:monthPlan.key, num:w.num}));

  root.appendChild(wrap);
}

function completeAction(a){
  a.status='terminee';
  if(!a._counted){
    a._counted=true;
    logActivity(`${state.currentUser.name} a terminé une action — ${esc(a.title)}`, 'check');
  }
  if(a.prospectId){
    const p = PROSPECTS.find(x=>x.id===a.prospectId);
    if(p){ p.lastInteraction=new Date(TODAY); p.history.unshift({date:TODAY, text:`Action réalisée : ${a.title}.`, user:state.currentUser.name}); saveProspect(p); }
  }
}

const ECART_RAISONS = ['Manque de temps','Manque de prospects','Faible taux de réponse','Problèmes de disponibilité','Rendez-vous annulés','Propositions non finalisées','Autre'];

function renderBilanSemaine(){
  root.innerHTML='';

  const idx = monthPlan.weeks.findIndex(w=>w.num===state.params.num);
  if(idx===-1){ setScreen('plan'); return; }
  const w = monthPlan.weeks[idx];
  if(!w.bilan) w.bilan = { pourquoi:[], commentaire:'', fonctionne:'', pasFonctionne:'', decisions:'' };
  const wc = weekComputed(monthPlan, idx);

  const wrap = el(`
    <div>
      <div class="topbar"><button class="icon-btn" id="back">${icon('chevron-left')}</button><span class="voice" style="font-size:14px;font-weight:600;">Bilan S${w.num}</span><span style="width:34px;"></span></div>
      <div class="page-title">Bilan de la semaine ${w.num}</div>

      <div class="card" style="padding:0; overflow:hidden;">
        <table class="data-table" style="padding:14px;">
          <thead><tr><th>Indicateur</th><th class="num">Objectif</th><th class="num">Réalisé</th><th class="num">Écart</th><th class="num">%</th></tr></thead>
          <tbody id="bilan-body"></tbody>
        </table>
      </div>

      <div class="section-title"><span>Pourquoi les objectifs n'ont-ils pas été atteints ?</span></div>
      <div class="checkbox-grid" id="raisons-grid"></div>

function filteredProspects(){
  const q = state.prospectQuery.trim().toLowerCase();
  return PROSPECTS.filter(p=>{
    if(!isActive(p)) return false; // les clients vivent dans leur propre onglet
    let mf=true;
    if(state.prospectFilter==='risque') mf=isRisky(p);
    else if(state.prospectFilter==='convertir') mf=isToConvert(p);
    else if(state.prospectFilter==='sans_action') mf=!nextActionFor(p);
    else if(state.prospectFilter==='action_jour') mf=(()=>{ const na=nextActionFor(p); return na && sameDay(na.date,TODAY); })();
    else if(state.prospectFilter==='action_retard') mf=(()=>{ const na=nextActionFor(p); return na && isPast(na.date); })();
    else if(state.prospectFilter!=='tous') mf=p.status===state.prospectFilter;
    if(mf && state.tempFilter && state.tempFilter!=='tous') mf = p.temperature===state.tempFilter;
    const mq = !q || p.name.toLowerCase().includes(q) || primaryProject(p).toLowerCase().includes(q);
    return mf && mq;
  });
}

function prospectCard(p){
  const meta = STATUS_META[p.status];
  const assigned = userById(p.assignedTo);
  const temp = TEMP_META[p.temperature];
  const na = nextActionFor(p);
  const risk = riskInfo(p);
  const card = el(`
    <button class="prospect-card">
      <div class="prospect-top">
        <div><div class="prospect-name">${esc(p.name)}</div><div class="prospect-book">${esc(primaryProject(p))}</div></div>
      </div>
      <div class="badge-row">
        <span class="badge" style="background:var(--bg); color:var(--ink); border:1px solid var(--line);">${meta.label}</span>
        ${temp?`<span class="temp-badge"><span class="temp-dot ${p.temperature}"></span>${temp.label}</span>`:''}
        ${p.priority && p.priority!=='p3' ? `<span class="badge" style="background:${p.priority==='p1'?'var(--danger-light)':'var(--warn-light)'}; color:${p.priority==='p1'?'var(--danger)':'var(--warn)'};">${PRIORITY_META[p.priority].label}</span>` : ''}
      </div>
      ${isActive(p) ? (na
        ? `<div class="next-line ${isPast(na.date)?'overdue':''}">${icon('clock','icon-sm')} ${esc(na.title)} — ${fmtShort(na.date)}</div>`
        : `<div class="next-line none">${icon('alert','icon-sm')} Aucune prochaine action</div>`) : ''}
      ${risk ? `<div class="next-line overdue">${icon('alert','icon-sm')} ${esc(risk.reason)}</div>` : ''}
      <div class="prospect-foot"><span>${p.lastInteraction?fmtShort(p.lastInteraction):'—'}</span>
        <span class="who-inline"><span class="who-avatar">${assigned?assigned.initials[0]:'?'}</span>${assigned?assigned.name:''}</span>
      </div>
    </button>`);
  card.addEventListener('click', ()=>setScreen('prospect-detail',{id:p.id}));
  return card;
}

function renderProspectBody(bodyEl){
  bodyEl.innerHTML='';
  const list = filteredProspects();
  if(!list.length){
    bodyEl.appendChild(el(`<div class="empty">${icon('users','icon-lg')}<div class="voice">Aucun prospect</div><div>Ajoutez votre premier prospect avec le bouton +.</div></div>`));
    return;
  }
  if(state.prospectView==='liste'){
    list.forEach(p=>bodyEl.appendChild(prospectCard(p)));
  } else {
    const groups={}; list.forEach(p=>{ (groups[p.status]=groups[p.status]||[]).push(p); });
    Object.keys(groups).sort((a,b)=>STATUS_META[a].order-STATUS_META[b].order).forEach(status=>{
      const meta=STATUS_META[status];
      const group=el(`<div class="pipeline-group"><div class="pipeline-head"><span>${meta.label}</span><span class="pipeline-count">${groups[status].length}</span></div></div>`);
      groups[status].forEach(p=>group.appendChild(prospectCard(p)));
      bodyEl.appendChild(group);
    });
  }
}

      <button class="btn-fill" id="new-action-btn">${icon('plus','icon-sm')}Action</button>

    const initials = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const nextTitle = overlay.querySelector('#np-next-title').value.trim();
    const nextDate = overlay.querySelector('#np-next-date').value;
    const submitBtn = overlay.querySelector('#np-submit');
    const baseP = {
      name, initials, projects:[{id:'proj'+Date.now(), title:project, status:'Nouveau'}],
      phone: overlay.querySelector('#np-phone').value.trim(), email: overlay.querySelector('#np-email').value.trim(),
      source: overlay.querySelector('#np-source').value, assignedTo: overlay.querySelector('#np-user').value,
      priority: overlay.querySelector('#np-priority').value,
      status:'nouveau', temperature:'tiede', profession:'', format:'', description:'',
      createdAt: new Date(TODAY), lastInteraction: new Date(TODAY),
      milestones:{}, history:[{date:TODAY, text:'Prospect créé.', user:state.currentUser.name}],
    };
    let newId;
    if(fbReady()){
      submitBtn.disabled = true; submitBtn.textContent = 'Enregistrement…';
      try{ newId = await createProspectRemote(baseP); }
      catch(err){
        errorEl.textContent = "Impossible d'enregistrer dans la base partagée. Vérifiez la connexion et réessayez.";
        errorEl.style.display='block'; submitBtn.disabled=false; submitBtn.textContent='Ajouter le prospect';
        return;
      }
    } else {
      newId = 'local'+Date.now();
    }
    const newP = { ...baseP, id:newId };
    PROSPECTS.unshift(newP);
    const w = getCurrentWeek(); if(w) w.results.prospects=(w.results.prospects||0)+1;
    if(nextTitle){
      const date = fromInputDate(nextDate);
      const week = findWeekForDate(getMonthPlan(monthKey(date)), date) || w;
      if(week) week.actions.push({ id:'ac'+Date.now(), title:nextTitle, category:'Suivi', responsable:newP.assignedTo, date, originalDate:date, reportHistory:[], priority:'moyenne', status:'a_faire', prospectId:newP.id, _counted:false });
    }
    logActivity(`${state.currentUser.name} a ajouté un prospect — ${esc(project)}`, 'users');
    overlay.remove();
    setScreen('prospect-detail', {id:newId});
  }
  overlay.querySelector('#np-submit').addEventListener('click', ()=>{
    const name = overlay.querySelector('#np-name').value.trim();
    const phone = overlay.querySelector('#np-phone').value.trim();
    const email = overlay.querySelector('#np-email').value.trim();
    const dup = name ? findPossibleDuplicate(name, phone, email) : null;
    if(dup){
      if(confirm(`Ce prospect semble déjà exister (${dup.name}). Voulez-vous consulter sa fiche au lieu d'en créer un nouveau ?`)){
        overlay.remove(); setScreen('prospect-detail',{id:dup.id}); return;
      }
    }
    doCreate();
  });
}

function renderActions(){
  root.innerHTML='';
  const wrap = el(`
    <div>
      <div class="topbar"><span class="voice" style="font-size:14px;font-weight:600;">RHEMA PILOT</span><button class="icon-btn dot" id="go-notif">${icon('bell')}</button></div>

      <div id="actions-body"></div>
    </div>`);
  const tabs=[['aujourdhui',"Aujourd'hui"],['semaine','Cette semaine'],['avenir','À venir'],['retard','En retard']];
  const subtab = wrap.querySelector('#subtab');
  tabs.forEach(([id,label])=>{
    const btn = el(`<button class="${state.actionsTab===id?'active':''}">${label}</button>`);
    btn.addEventListener('click', ()=>{ state.actionsTab=id; renderActions(); });
    subtab.appendChild(btn);
  });
  const body = wrap.querySelector('#actions-body');
  const all = allActionsFlat();
  const curWeek = getCurrentWeek();
  if(state.actionsTab==='aujourdhui') paintActionGroup(body, all.filter(a=>sameDay(a.date,TODAY)), "Aucune action prévue aujourd'hui.");
  else if(state.actionsTab==='semaine') paintActionGroup(body, curWeek ? all.filter(a=>a.date>=curWeek.start && a.date<=curWeek.end).sort((x,y)=>x.date-y.date) : [], "Aucune semaine en cours identifiée.");
  else if(state.actionsTab==='avenir') paintActionGroup(body, all.filter(a=>a.date>TODAY && !sameDay(a.date,TODAY)).sort((x,y)=>x.date-y.date), "Aucune action à venir.");
  else paintActionGroup(body, all.filter(a=>isPast(a.date) && a.status!=='terminee' && a.status!=='annulee'), "Aucune action en retard.");

  wrap.querySelector('#go-notif').addEventListener('click', ()=>setScreen('notifications'));
  root.appendChild(wrap);
}

function paintActionGroup(body, list, emptyText){
  if(!list.length){ body.appendChild(el(`<div class="empty">${icon('check-square','icon-lg')}<div class="voice">Rien ici</div><div>${emptyText}</div></div>`)); return; }
  list.forEach(a=>{
    const resp = userById(a.responsable);
    const item = el(`
      <div class="task-item ${a.status==='terminee'?'done':''}">
        <button class="task-check ${a.status==='terminee'?'checked':''}">${a.status==='terminee'?icon('check','icon-sm'):''}</button>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;gap:8px;">
            <div class="task-title">${esc(a.title)}</div>
            <span class="tag ${a.priority}">${a.priority}</span>
          </div>
          <div class="task-sub">${esc(a.category)} · ${resp?resp.name:''}</div>
          <div class="task-meta">${fmtFull(a.date)}</div>
        </div>
      </div>`);
    item.querySelector('.task-check').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(a.status==='terminee'){ a.status='a_faire'; } else { completeAction(a); }
      renderActions();
    });
    if(isPast(a.date) && a.status!=='terminee' && a.status!=='annulee'){
      const reportBtn = el(`<button class="secondary-btn" style="margin-top:8px;">Reporter</button>`);
      reportBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openReportActionModal(a, ()=>renderActions()); });
      item.appendChild(reportBtn);
    }
    body.appendChild(item);
  });
}

function renderRapports(){
  root.innerHTML='';
  const monthPlan = getMonthPlan(CURRENT_MONTH_KEY);
  const total = monthResultsTotal(monthPlan);
  const clients = PROSPECTS.filter(isClient);
  const funnel = [
    {label:'Prospects', value:total.prospects},
    {label:'Contacts', value:total.contacts},
    {label:'Rendez-vous', value:total.rdv},
    {label:'Propositions', value:total.propositions},
    {label:'Contrats', value:total.contrats},
  ];
  const max = funnel[0].value || 1;

  const sourceStats = SOURCE_LABELS.map(s=>{
    const list = PROSPECTS.filter(p=>p.source===s);
    return { label:s, prospects:list.length, contrats:list.filter(isClient).length };
  }).filter(s=>s.prospects>0);

  const lateActionsAll = allActionsFlat().filter(a=>isPast(a.date) && a.status!=='terminee' && a.status!=='annulee');
  const teamStats = USERS.map(u=>{
    const objectif = monthPlan.individualObjectives && monthPlan.individualObjectives[u.id]>0 ? monthPlan.individualObjectives[u.id] : null;
    const realise = PROSPECTS.filter(p=>p.assignedTo===u.id && monthKey(p.createdAt)===CURRENT_MONTH_KEY).length;
    const late = lateActionsAll.filter(a=>a.responsable===u.id).length;
    return { user:u, objectif, realise, ecart: objectif===null?null:realise-objectif, late };
  });

  const wrap = el(`
    <div>
      <div class="topbar"><span class="voice" style="font-size:14px;font-weight:600;">RHEMA PILOT</span><button class="icon-btn dot" id="go-notif">${icon('bell')}</button></div>
      <div class="page-title">Rapports</div>
      <div class="page-sub">${monthLabel(CURRENT_MONTH_KEY)} — prospection &amp; conversion, sans données financières</div>

      <div class="kpi-card"><div class="kpi-label">Nouveaux prospects — KPI principal</div><div class="kpi-value">${total.prospects} <small style="font-size:14px;color:var(--muted-light);">/ ${monthPlan.objectives.prospects}</small></div><div class="kpi-sub">${pct(total.prospects,monthPlan.objectives.prospects)}% de l'objectif mensuel</div></div>
      <div class="kpi-card"><div class="kpi-label">Clients (contrats signés)</div><div class="kpi-value">${clients.length}</div></div>

      <div class="section-title"><span>Entonnoir de conversion</span></div>
      <div class="card" id="funnel"></div>

      <div class="section-title"><span>Taux de conversion par étape</span></div>
      <div class="card" id="conv-steps"></div>

      <div class="section-title"><span>Évolution par semaine — nouveaux prospects</span></div>
      <div class="card"><div class="bars-mini" id="bars"></div></div>

      <div class="section-title"><span>Performance des sources</span></div>
      <div class="card"><table class="data-table"><thead><tr><th>Source</th><th class="num">Prospects</th><th class="num">Contrats</th></tr></thead><tbody id="source-table"></tbody></table></div>

      <div class="section-title"><span>Équipe commerciale</span></div>
      <div class="card"><table class="data-table"><thead><tr><th>Commercial</th><th class="num">Objectif</th><th class="num">Réalisé</th><th class="num">Écart</th><th class="num">Retard</th></tr></thead><tbody id="team-table"></tbody></table></div>
    </div>`);

  const funnelEl = wrap.querySelector('#funnel');
  funnel.forEach((f,i)=>{
    const width = Math.max(16, pct(f.value,max));
    const prev = i>0?funnel[i-1].value:null;
    const conv = prev?pct(f.value,prev):null;
    funnelEl.appendChild(el(`<div class="funnel-row"><div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${width}%;">${f.value} ${f.label}</div></div>${conv!==null?`<div class="funnel-conv">${conv}% de conversion</div>`:''}</div>`));
  });

  const convSteps = wrap.querySelector('#conv-steps');
  [['Prospect → Contact',total.prospects,total.contacts],['Contact → RDV',total.contacts,total.rdv],['RDV → Proposition',total.rdv,total.propositions],['Proposition → Contrat',total.propositions,total.contrats]].forEach(([label,from,to])=>{
    convSteps.appendChild(el(`<div class="report-row" style="justify-content:space-between;"><span>${label}</span><span style="font-weight:700;">${pct(to,from)}%</span></div>`));
  });

  const bars = wrap.querySelector('#bars');
  const maxW = Math.max(1, ...monthPlan.weeks.map(w=>Math.max(w.results.prospects,w.objectives.prospects)));
  monthPlan.weeks.forEach(w=>{
    const h = Math.round((w.results.prospects/maxW)*100);
    bars.appendChild(el(`<div class="b"><div class="bfill" style="height:${h}%;"></div><div class="blbl">S${w.num}</div></div>`));
  });

  wrap.querySelector('#source-table').append(...sourceStats.map(s=>el(`<tr><td>${s.label}</td><td class="num">${s.prospects}</td><td class="num">${s.contrats}</td></tr>`)));
  wrap.querySelector('#team-table').append(...teamStats.map(t=>el(`<tr><td>${t.user.name}</td><td class="num">${t.objectif===null?'<span style=\"color:var(--muted-light); font-weight:600;\">Non défini</span>':t.objectif}</td><td class="num">${t.realise}</td><td class="num" style="color:${t.ecart===null?'var(--muted-light)':(t.ecart<0?'var(--danger)':'var(--primary)')}">${t.ecart===null?'—':(t.ecart>0?'+':'')+t.ecart}</td><td class="num" style="color:${t.late>0?'var(--danger)':'var(--muted-light)'}">${t.late}</td></tr>`)));

  wrap.querySelector('#go-notif').addEventListener('click', ()=>setScreen('notifications'));
  root.appendChild(wrap);
}

  'login': {render:renderLogin, nav:false},
  'dashboard': {render:renderDashboard, nav:'dashboard'},
  'plan': {render:renderPlan, nav:'plan'},
  'semaine': {render:renderSemaine, nav:'plan'},
  'bilan-semaine': {render:renderBilanSemaine, nav:'plan'},
  'prospects-clients': {render:renderProspectsClients, nav:'prospects-clients'},
  'prospect-detail': {render:renderProspectDetail, nav:null},
  'actions': {render:renderActions, nav:'actions'},
  'rapports': {render:renderRapports, nav:'rapports'},
  'notifications': {render:renderNotifications, nav:null},
  'profil': {render:renderProfil, nav:null},
};
function clearTransient(){ document.querySelectorAll('[data-transient]').forEach(n=>n.remove()); }
const demoBanner = document.getElementById('demo-banner');
const fabAdd = document.getElementById('fab-add');
function paint(){
  clearTransient();
  demoBanner.hidden = !DEMO_MODE || state.screen==='login';
  const def = SCREENS[state.screen];
  if(!def) return;
  def.render();
  window.scrollTo(0,0);
  if(def.nav===false){ nav.hidden=true; fabAdd.hidden=true; }
  else{ nav.hidden=false; fabAdd.hidden=false; nav.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.nav===def.nav)); }
}
nav.addEventListener('click', e=>{ const btn=e.target.closest('button[data-nav]'); if(!btn) return; state.viewMonthKey=CURRENT_MONTH_KEY; setScreen(btn.dataset.nav); });
fabAdd.addEventListener('click', openQuickCreateSheet);
paint();
})();
</script>
</body>
</html>
